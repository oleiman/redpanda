# Compaction Stress Tool — Example Configuration
#
# Copy to config.yaml and edit the cluster section for your environment.
# Scenario defaults are tuned for a 6-node cluster — you generally don't
# need to override them. Just set your brokers/auth and go.

cluster:
  brokers: "localhost:9092"
  # sasl_mechanism: "SCRAM-SHA-256"
  # sasl_user: "admin"
  # sasl_password: "secret"
  # tls_enabled: true
  # admin_hosts:
  #   - "node1:9644"
  #   - "node2:9644"

# Cluster-level configs set via rpk with --set-cluster-config.
# To stress compaction harder, shrink key_map_memory (requires restart):
#   cloud_topics_compaction_key_map_memory: 16777216  # 16 MB
cluster_config:
  cloud_topics_enabled: true
  cloud_topics_compaction_interval_ms: 5000
  cloud_topics_compaction_max_object_size: 134217728   # 128 MB
  cloud_topics_compaction_key_map_memory: 134217728    # 128 MB

# Scenario overrides — only set what you want to change.
# Omitted fields use built-in defaults (see below).
#
# Built-in defaults:
#   key_cardinality:  500K keys, 16KB msgs, 200 MB/s, 3 workers, 8 partitions
#   extreme_dedup:    100 keys, 16KB msgs, 200 MB/s, 3 workers, 4 partitions
#   continuous_write: 200K keys, 16KB msgs, 200 MB/s, 3 workers, 12 partitions
#   tombstone:        5K keys, 16KB msgs, 150 MB/s, 3 workers, 8 partitions
#   multi_partition:  50K keys, 16KB msgs, 300 MB/s, 4 workers, 6x16 partitions
#
# scenarios:
#   key_cardinality:
#     enabled: false    # disable a scenario
#   extreme_dedup:
#     num_producers: 6  # more in-process workers
#   continuous_write:
#     partitions: 24    # more partitions

# Duration: "1h", "30m", "12h", or "indefinite"
duration: "1h"

log_dir: "./logs"
report_interval: 30
