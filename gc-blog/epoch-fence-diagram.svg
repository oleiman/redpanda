<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    text { font-size: 13px; fill: #333; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .step-label { font-size: 14px; font-weight: bold; fill: #222; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; }
    .dim { fill: #888; }
    .epoch-label { font-size: 11px; fill: #fff; font-weight: bold; }
    .field-label { font-size: 13px; fill: #555; }
    .field-value { font-size: 13px; font-weight: bold; fill: #222; font-family: 'JetBrains Mono', monospace; }
    .tick { stroke: #bbb; stroke-width: 1; }
    .tick-label { font-size: 9px; fill: #aaa; }
  </style>

  <!--
    Coordinate system for the log bar:
      x=30..530 (500px) maps to offset 0..400
      1 offset unit = 1.25px
      Key positions:
        off   0 → x= 30     off 200 → x=280
        off 100 → x=155     off 250 → x=342
        off 150 → x=218     off 300 → x=405
                              off 310 → x=418

    Within each step group, vertical layout:
      y= 0       step label
      y=28..38   window label + bracket
      y=44..74   log bar (y=44, h=30, bottom=74)
      y=80       offset tick marks
      y=88       Reconciler arrow (tip at y=80, tail to y=90, text at y=102)
      y=44..90   state fields (right side)
  -->

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" class="title">Epoch Fence: Sliding Window Progression</text>

  <!-- ====== STEP 1 ====== -->
  <g transform="translate(0, 60)">
    <text x="30" y="8" class="step-label">1. First placeholder at epoch 5, offset 100</text>

    <!-- Window bracket -->
    <text x="180" y="31" text-anchor="middle" font-size="10" fill="#e05050" font-weight="normal"><tspan font-weight="normal">window </tspan><tspan font-weight="bold">[5, 5]</tspan></text>
    <line x1="155" y1="38" x2="205" y2="38" stroke="#e05050" stroke-width="2"/>
    <line x1="155" y1="38" x2="155" y2="43" stroke="#e05050" stroke-width="2"/>
    <line x1="205" y1="38" x2="205" y2="43" stroke="#e05050" stroke-width="2"/>

    <!-- Log bar -->
    <rect x="30" y="44" width="500" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>

    <!-- Tick marks along bottom of bar -->
    <line x1="30"  y1="74" x2="30"  y2="79" class="tick"/>
    <line x1="155" y1="74" x2="155" y2="79" class="tick"/>
    <line x1="280" y1="74" x2="280" y2="79" class="tick"/>
    <line x1="405" y1="74" x2="405" y2="79" class="tick"/>
    <line x1="530" y1="74" x2="530" y2="79" class="tick"/>
    <text x="30"  y="88" text-anchor="middle" class="tick-label">0</text>
    <text x="155" y="88" text-anchor="middle" class="tick-label">100</text>
    <text x="280" y="88" text-anchor="middle" class="tick-label">200</text>
    <text x="405" y="88" text-anchor="middle" class="tick-label">300</text>
    <text x="530" y="88" text-anchor="middle" class="tick-label">400</text>

    <!-- Placeholder E=5 at offset 100 (left-aligned at x=155) -->
    <rect x="155" y="46" width="50" height="26" rx="3" fill="#4a90d9"/>
    <text x="180" y="63" text-anchor="middle" class="epoch-label">E=5</text>

    <!-- Reconciler at offset 0 (x=30) -->
    <polygon points="30,87 25,101 35,101" fill="#2eaa2e" opacity="0.5"/>
    <line x1="30" y1="101" x2="30" y2="111" stroke="#2eaa2e" stroke-width="2" opacity="0.5"/>
    <text x="30" y="123" text-anchor="middle" font-size="10" fill="#2eaa2e" font-weight="bold">LRO=0</text>

    <!-- State table -->
    <g transform="translate(570, 30)">
      <rect x="0" y="0" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="22" width="330" height="22" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="44" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <line x1="190" y1="0" x2="190" y2="66" stroke="#ddd"/>
      <text x="8" y="15" class="field-label">min_epoch_lower_bound</text>
      <text x="200" y="15" class="field-value">5</text>
      <text x="8" y="37" class="field-label">estimate_inactive_epoch</text>
      <text x="200" y="37" class="field-value">prev(5) = 4</text>
      <text x="8" y="59" class="field-label">window_offset</text>
      <text x="200" y="59" class="field-value">100</text>
    </g>
  </g>

  <!-- ====== STEP 2 ====== -->
  <g transform="translate(0, 210)">
    <text x="30" y="8" class="step-label">2. Placeholder at epoch 10, offset 200</text>

    <!-- Window bracket [5, 10] spans E=5 block to E=10 block -->
    <text x="242" y="31" text-anchor="middle" font-size="10" fill="#e05050" font-weight="normal"><tspan font-weight="normal">window </tspan><tspan font-weight="bold">[5, 10]</tspan></text>
    <line x1="155" y1="38" x2="330" y2="38" stroke="#e05050" stroke-width="2"/>
    <line x1="155" y1="38" x2="155" y2="43" stroke="#e05050" stroke-width="2"/>
    <line x1="330" y1="38" x2="330" y2="43" stroke="#e05050" stroke-width="2"/>

    <!-- Log bar -->
    <rect x="30" y="44" width="500" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>

    <!-- Ticks -->
    <line x1="30"  y1="74" x2="30"  y2="79" class="tick"/>
    <line x1="155" y1="74" x2="155" y2="79" class="tick"/>
    <line x1="280" y1="74" x2="280" y2="79" class="tick"/>
    <line x1="405" y1="74" x2="405" y2="79" class="tick"/>
    <line x1="530" y1="74" x2="530" y2="79" class="tick"/>
    <text x="30"  y="88" text-anchor="middle" class="tick-label">0</text>
    <text x="155" y="88" text-anchor="middle" class="tick-label">100</text>
    <text x="280" y="88" text-anchor="middle" class="tick-label">200</text>
    <text x="405" y="88" text-anchor="middle" class="tick-label">300</text>
    <text x="530" y="88" text-anchor="middle" class="tick-label">400</text>

    <!-- Placeholder E=5 (faded) -->
    <rect x="155" y="46" width="50" height="26" rx="3" fill="#a0c4e8"/>
    <text x="180" y="63" text-anchor="middle" class="epoch-label" fill="#666">E=5</text>

    <!-- Placeholder E=10 at offset 200 (left-aligned at x=280) -->
    <rect x="280" y="46" width="50" height="26" rx="3" fill="#4a90d9"/>
    <text x="305" y="63" text-anchor="middle" class="epoch-label">E=10</text>

    <!-- Reconciler at offset 0 (x=30) -->
    <polygon points="30,87 25,101 35,101" fill="#2eaa2e" opacity="0.5"/>
    <line x1="30" y1="101" x2="30" y2="111" stroke="#2eaa2e" stroke-width="2" opacity="0.5"/>
    <text x="30" y="123" text-anchor="middle" font-size="10" fill="#2eaa2e" font-weight="bold">LRO=0</text>

    <!-- State table -->
    <g transform="translate(570, 30)">
      <rect x="0" y="0" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="22" width="330" height="22" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="44" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <line x1="190" y1="0" x2="190" y2="66" stroke="#ddd"/>
      <text x="8" y="15" class="field-label">min_epoch_lower_bound</text>
      <text x="200" y="15" class="field-value">5</text>
      <text x="8" y="37" class="field-label">estimate_inactive_epoch</text>
      <text x="200" y="37" class="field-value">prev(5) = 4</text>
      <text x="8" y="59" class="field-label">window_offset</text>
      <text x="200" y="59" class="field-value">200</text>
    </g>
  </g>

  <!-- ====== STEP 3 ====== -->
  <g transform="translate(0, 360)">
    <text x="30" y="8" class="step-label">3. Placeholder at epoch 15, offset 300 — reconciler behind</text>

    <!-- Window bracket [10, 15] spans E=10 block to E=15 block -->
    <text x="368" y="31" text-anchor="middle" font-size="10" fill="#e05050" font-weight="normal"><tspan font-weight="normal">window </tspan><tspan font-weight="bold">[10, 15]</tspan></text>
    <line x1="280" y1="38" x2="455" y2="38" stroke="#e05050" stroke-width="2"/>
    <line x1="280" y1="38" x2="280" y2="43" stroke="#e05050" stroke-width="2"/>
    <line x1="455" y1="38" x2="455" y2="43" stroke="#e05050" stroke-width="2"/>

    <!-- Log bar -->
    <rect x="30" y="44" width="500" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>

    <!-- Ticks -->
    <line x1="30"  y1="74" x2="30"  y2="79" class="tick"/>
    <line x1="155" y1="74" x2="155" y2="79" class="tick"/>
    <line x1="280" y1="74" x2="280" y2="79" class="tick"/>
    <line x1="405" y1="74" x2="405" y2="79" class="tick"/>
    <line x1="530" y1="74" x2="530" y2="79" class="tick"/>
    <text x="30"  y="88" text-anchor="middle" class="tick-label">0</text>
    <text x="155" y="88" text-anchor="middle" class="tick-label">100</text>
    <text x="280" y="88" text-anchor="middle" class="tick-label">200</text>
    <text x="405" y="88" text-anchor="middle" class="tick-label">300</text>
    <text x="530" y="88" text-anchor="middle" class="tick-label">400</text>

    <!-- Placeholder E=5 (very faded) -->
    <rect x="155" y="46" width="50" height="26" rx="3" fill="#d0d8e0"/>
    <text x="180" y="63" text-anchor="middle" font-size="11" fill="#999">E=5</text>

    <!-- Placeholder E=10 (faded) -->
    <rect x="280" y="46" width="50" height="26" rx="3" fill="#a0c4e8"/>
    <text x="305" y="63" text-anchor="middle" class="epoch-label" fill="#666">E=10</text>

    <!-- Placeholder E=15 at offset 300 (left-aligned at x=405) -->
    <rect x="405" y="46" width="50" height="26" rx="3" fill="#4a90d9"/>
    <text x="430" y="63" text-anchor="middle" class="epoch-label">E=15</text>

    <!-- Reconciler at offset 250 (x=342) -->
    <polygon points="342,82 337,96 347,96" fill="#2eaa2e" opacity="0.5"/>
    <line x1="342" y1="96" x2="342" y2="106" stroke="#2eaa2e" stroke-width="2" opacity="0.5"/>
    <text x="342" y="118" text-anchor="middle" font-size="10" fill="#2eaa2e" font-weight="bold">LRO=250</text>

    <!-- State table -->
    <g transform="translate(570, 30)">
      <rect x="0" y="0" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="22" width="330" height="22" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="44" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <line x1="190" y1="0" x2="190" y2="66" stroke="#ddd"/>
      <text x="8" y="15" class="field-label">min_epoch_lower_bound</text>
      <text x="200" y="15" class="field-value">5</text>
      <text x="8" y="37" class="field-label">estimate_inactive_epoch</text>
      <text x="200" y="37" class="field-value">prev(5) = 4</text>
      <text x="8" y="59" class="field-label">window_offset</text>
      <text x="200" y="59" class="field-value">300</text>
      <text x="0" y="82" class="dim" font-size="10">LRO 250 &lt; window_offset 300</text>
      <text x="0" y="94" class="dim" font-size="10">→ floor cannot advance yet</text>
    </g>
  </g>

  <!-- ====== STEP 4 ====== -->
  <g transform="translate(0, 510)">
    <text x="30" y="8" class="step-label">4. Reconciler catches up past offset 300</text>

    <!-- Window bracket [10, 15] -->
    <text x="368" y="31" text-anchor="middle" font-size="10" fill="#e05050" font-weight="normal"><tspan font-weight="normal">window </tspan><tspan font-weight="bold">[10, 15]</tspan></text>
    <line x1="280" y1="38" x2="455" y2="38" stroke="#e05050" stroke-width="2"/>
    <line x1="280" y1="38" x2="280" y2="43" stroke="#e05050" stroke-width="2"/>
    <line x1="455" y1="38" x2="455" y2="43" stroke="#e05050" stroke-width="2"/>

    <!-- Log bar -->
    <rect x="30" y="44" width="500" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>

    <!-- Ticks -->
    <line x1="30"  y1="74" x2="30"  y2="79" class="tick"/>
    <line x1="155" y1="74" x2="155" y2="79" class="tick"/>
    <line x1="280" y1="74" x2="280" y2="79" class="tick"/>
    <line x1="405" y1="74" x2="405" y2="79" class="tick"/>
    <line x1="530" y1="74" x2="530" y2="79" class="tick"/>
    <text x="30"  y="88" text-anchor="middle" class="tick-label">0</text>
    <text x="155" y="88" text-anchor="middle" class="tick-label">100</text>
    <text x="280" y="88" text-anchor="middle" class="tick-label">200</text>
    <text x="405" y="88" text-anchor="middle" class="tick-label">300</text>
    <text x="530" y="88" text-anchor="middle" class="tick-label">400</text>

    <!-- Placeholder E=5 (safe to GC) -->
    <rect x="155" y="46" width="50" height="26" rx="3" fill="#d4edda" stroke="#28a745"/>
    <text x="180" y="63" text-anchor="middle" font-size="11" fill="#155724">E=5</text>

    <!-- Placeholder E=10 (reconciled) -->
    <rect x="280" y="46" width="50" height="26" rx="3" fill="#e8e8e8" stroke="#ccc" stroke-dasharray="3,2"/>
    <text x="305" y="63" text-anchor="middle" font-size="11" fill="#bbb">E=10</text>

    <!-- Placeholder E=15 -->
    <rect x="405" y="46" width="50" height="26" rx="3" fill="#a0c4e8"/>
    <text x="430" y="63" text-anchor="middle" class="epoch-label" fill="#666">E=15</text>

    <!-- Reconciler at offset 310 (x=418) -->
    <polygon points="418,82 413,96 423,96" fill="#2eaa2e" opacity="0.5"/>
    <line x1="418" y1="96" x2="418" y2="106" stroke="#2eaa2e" stroke-width="2" opacity="0.5"/>
    <text x="418" y="118" text-anchor="middle" font-size="10" fill="#2eaa2e" font-weight="bold">LRO=310</text>

    <!-- State table -->
    <g transform="translate(570, 30)">
      <rect x="0" y="0" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="22" width="330" height="22" fill="#f8f8f8" stroke="#ddd"/>
      <rect x="0" y="44" width="330" height="22" rx="2" fill="#f8f8f8" stroke="#ddd"/>
      <line x1="190" y1="0" x2="190" y2="66" stroke="#ddd"/>
      <text x="8" y="15" class="field-label">min_epoch_lower_bound</text>
      <text x="200" y="15" class="field-value">10 <tspan style="fill: #2eaa2e">▲</tspan></text>
      <text x="8" y="37" class="field-label">estimate_inactive_epoch</text>
      <text x="200" y="37" class="field-value">prev(10) = 9 <tspan style="fill: #2eaa2e">▲</tspan></text>
      <text x="8" y="59" class="field-label">window_offset</text>
      <text x="200" y="59" class="field-value">300</text>
      <text x="0" y="82" class="dim" font-size="10">LRO 310 ≥ window_offset 300</text>
      <text x="0" y="94" class="dim" font-size="10">→ floor advances to prev_applied = 10</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 680)">
    <rect x="0" y="0" width="860" height="30" rx="4" fill="#fafafa" stroke="#ddd"/>
    <rect x="15" y="8" width="24" height="14" rx="2" fill="#4a90d9"/>
    <text x="45" y="19" font-size="11" fill="#555">current epoch</text>
    <rect x="155" y="8" width="24" height="14" rx="2" fill="#e8e8e8" stroke="#ccc" stroke-dasharray="3,2"/>
    <text x="185" y="19" font-size="11" fill="#555">reconciled</text>
    <line x1="268" y1="15" x2="318" y2="15" stroke="#e05050" stroke-width="2"/>
    <text x="324" y="19" font-size="11" fill="#555">applied window</text>
    <rect x="438" y="8" width="24" height="14" rx="2" fill="#d4edda" stroke="#28a745"/>
    <text x="468" y="19" font-size="11" fill="#555">safe to GC</text>
    <polygon points="558,6 553,18 563,18" fill="#2eaa2e" opacity="0.5"/>
    <line x1="558" y1="18" x2="558" y2="24" stroke="#2eaa2e" stroke-width="2" opacity="0.5"/>
    <text x="568" y="19" font-size="11" fill="#555">Reconciler</text>
    <line x1="640" y1="4" x2="640" y2="26" stroke="#ddd"/>
    <text x="650" y="19" font-size="11" fill="#555"><tspan font-weight="bold">LRO</tspan>: last reconciled offset</text>
  </g>
</svg>
