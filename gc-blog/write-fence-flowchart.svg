<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    text { font-size: 12px; fill: #333; }
    .title { font-size: 15px; font-weight: bold; fill: #111; }
    .subtitle { font-size: 11px; fill: #666; }
    .node-text { font-size: 11px; }
    .bold-text { font-size: 12px; font-weight: bold; }
    .edge-label { font-size: 10px; font-weight: bold; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0a030"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e05050"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!--
    Layout: main spine at x=200, reset branch at x=410, reject at x=30
    Vertical:  entry=70  term=130  where=280  outcomes=400+
  -->

  <!-- Entry oval -->
  <ellipse cx="200" cy="70" rx="95" ry="18" fill="#f0f0f0" stroke="#999"/>
  <text x="200" y="74" text-anchor="middle" class="node-text">write arrives with epoch E</text>

  <!-- ↓ -->
  <line x1="200" y1="88" x2="200" y2="108" stroke="#999" marker-end="url(#a)"/>

  <!-- Term check diamond -->
  <polygon points="200,110 280,145 200,180 120,145" fill="#fff" stroke="#999"/>
  <text x="200" y="142" text-anchor="middle" class="node-text">term changed</text>
  <text x="200" y="154" text-anchor="middle" class="node-text">since last fence?</text>

  <!-- Yes → reset (right) -->
  <line x1="280" y1="145" x2="340" y2="145" stroke="#c0a030" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="310" y="138" text-anchor="middle" class="edge-label" fill="#c0a030">yes</text>

  <rect x="344" y="122" width="170" height="46" rx="4" fill="#fff8e0" stroke="#c0a030"/>
  <text x="429" y="140" text-anchor="middle" class="node-text">reset seen window to</text>
  <text x="429" y="153" text-anchor="middle" class="node-text">applied window</text>
  <text x="429" y="164" text-anchor="middle" font-size="9" fill="#888">[prev_applied, max_applied]</text>

  <!-- Reset → back to spine between diamonds -->
  <path d="M 429 168 L 429 210 Q 429 225 414 225 L 218 225" fill="none" stroke="#c0a030" stroke-width="1.5" marker-end="url(#ay)"/>

  <!-- No ↓ -->
  <line x1="200" y1="180" x2="200" y2="225" stroke="#999" marker-end="url(#a)"/>
  <text x="190" y="200" text-anchor="end" class="edge-label" fill="#999">no</text>

  <!-- Where diamond -->
  <polygon points="200,228 295,268 200,308 105,268" fill="#fff" stroke="#999"/>
  <text x="200" y="264" text-anchor="middle" class="node-text">E vs seen window</text>
  <text x="200" y="276" text-anchor="middle" class="node-text">[prev_seen, max_seen]</text>

  <!-- Left: REJECT -->
  <line x1="105" y1="268" x2="58" y2="268" stroke="#e05050" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="82" y="260" text-anchor="middle" class="edge-label" fill="#e05050">E &lt; prev</text>

  <rect x="4" y="252" width="52" height="32" rx="4" fill="#fde8e8" stroke="#e05050"/>
  <text x="30" y="272" text-anchor="middle" class="bold-text" fill="#c03030">REJECT</text>

  <!-- Center ↓: in window → read lock -->
  <line x1="200" y1="308" x2="200" y2="360" stroke="#28a745" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="190" y="338" text-anchor="end" class="edge-label" fill="#28a745">in window</text>

  <rect x="110" y="364" width="180" height="24" rx="4" fill="#e8f4e8" stroke="#28a745"/>
  <text x="200" y="380" text-anchor="middle" class="node-text">hold window (shared lock)</text>

  <!-- ↓ to accept -->
  <line x1="200" y1="396" x2="200" y2="440" stroke="#28a745" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Right: E > max → slide -->
  <line x1="295" y1="268" x2="370" y2="268" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="332" y="260" text-anchor="middle" class="edge-label" fill="#4a90d9">E &gt; max</text>

  <rect x="364" y="248" width="150" height="40" rx="4" fill="#e8f0ff" stroke="#4a90d9"/>
  <text x="439" y="264" text-anchor="middle" class="node-text">slide window (exclusive lock)</text>
  <text x="439" y="276" text-anchor="middle" font-size="9" fill="#888">prev = max, max = E</text>

  <!-- ↓ downgrade -->
  <line x1="439" y1="288" x2="439" y2="360" stroke="#28a745" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="364" y="364" width="150" height="28" rx="4" fill="#e8f4e8" stroke="#28a745"/>
  <text x="439" y="382" text-anchor="middle" class="node-text">downgrade to shared lock</text>

  <!-- Curve down and right into accept box -->
  <path d="M 439 392 L 439 468 Q 439 468 424 468 L 292 468" fill="none" stroke="#28a745" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ACCEPT box -->
  <rect x="110" y="444" width="180" height="48" rx="4" fill="#d4edda" stroke="#28a745"/>
  <text x="200" y="464" text-anchor="middle" class="bold-text" fill="#155724">ACCEPT</text>
  <text x="200" y="480" text-anchor="middle" font-size="10" fill="#155724">enter replication pipeline</text>
</svg>
